/v1/pruebas/history:
  get:
    tags:
      - Test
    summary: Historial pre registro
    responses:
      200:
        description: Success
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
