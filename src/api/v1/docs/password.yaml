/v1/password/recovery:  
  post:
    tags:
      - Password
    summary: Olvide mi contraseña
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              Email:
                type: string
                format: Email
                description: Email del usuario
                example: usuario@ejemplo.com
    responses:
      200:
        description: Solicitud para recuperar contraseña
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "¡Solicitud aprovada!, Accede al correo (usuario@ejemplo.com) para seguir el proceso"
                body:
                  type: object
                  properties:
                    Token:
                      type: string
                      example: ""
                      description: Token para concluir el proceso

/v1/password/verifyToken:  
  get:
    tags: 
      - Password
    summary: 'Verifica la solicitud por medio del token'  
    security:
        - BearerAuth: []    
    responses:
      200:
        description: Se valida el acceso a la vista en el front
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "Vista autorizada"    

/v1/password/validCode: 
  post:
    tags: 
      - Password
    summary: 'Verifica que el código sea correcto para hacer el cambio de contraseña'  
    security:
        - BearerAuth: []    
    responses:
      200:
        description: Se valida el código
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "¡Código correcto! Puedes cambiar tu contraseña"    

/v1/password/change:
  put:
    tags: 
      - Password
    summary: 'Cambio de contraseña'  
    security:
        - BearerAuth: []    
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              Password:
                type: string
                description: Nueva contraseña
                example: "mi contraseña"
    responses:
      200:
        description: Cambio de contraseña
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "¡Contraseña actualizada! Ahora inicia sesión con tu nueva contraseña"    

/v1/password/newCode:
  get:
    tags:
      - Password
    summary: Solicitud de un nuevo código
    security:
      - BearerAuth: []
    responses:
      '200':
        description: Se envia nuevo código por email
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: Código enviado
