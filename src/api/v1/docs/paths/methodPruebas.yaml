/api/v1/pruebas/history:
  get:
    tags: [De pruebas]
    summary: Obtiene la lista de registros
    responses:
      200:
        description: Respuesta exitosa
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "Operación exitosa"
                body:
                  type: array
                  items:
                    type: object
                    properties:
                      DateCreate:
                        type: string
                        format: date-time
                        example: ""
                        description: Fecha de creación del registro
                      Id:
                        type: integer
                        example: 0
                        description: Identificador único del registro
                      Email:
                        type: string
                        format: email
                        example: ""
                        description: Correo electrónico del usuario (opcional)
                      Name:
                        type: string
                        example: ""
                        description: Nombre del usuario (opcional)
                      Firstname:
                        type: string
                        example: ""
                        description: Primer nombre del usuario (opcional)
                      Lastname:
                        type: string
                        example: ""
                        description: Apellido del usuario (opcional)
                      Username:
                        type: string
                        example: ""
                        description: Nombre de usuario (opcional)
                      StatusRegister:
                        type: string
                        example: ""
                        description: Estado del registro (opcional)
                      DateUpdate:
                        type: string
                        format: date-time
                        example: ""
                        description: Fecha de actualización del registro (opcional)
                      HasPassword:               
                        type: boolean
                        example: ""
                        description: Si el usuario tiene contraseña configurada (opcional)
























