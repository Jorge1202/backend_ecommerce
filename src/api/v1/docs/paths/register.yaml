/api/v1/register:
  post:
    tags: [Register User]
    summary: Registrar nuevo usuario
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              Email:
                type: string
                format: Email
                description: Email del usuario
                example: ""
              Password:
                type: string
                format: Password
                description: Password del usuario
                example: ""
              Name:
                type: string
                description: Nombre del usuario
                example: ""   
              Firstname:
                type: string
                description: Primer nombre del usuario
                example: ""    
              Lastname:    
                type: string
                description: Apellido del usuario
                example: ""  
              Username:
                type: string
                description: Nombre de usuario
                example: ""
              StatusRegister: 
                type: string
                description: Estado del registro
                example: ""                     

    responses:       
      200:
        description: Respuesta exitosa
        content:
          application/json:
            schema:    
              type: object          
              properties:
                error:
                  type: boolean
                  example: false
                status:
                  type: integer
                  example: 200
                message:
                  type: string
                  example: "Operación exitosa"
                body:
                  type: object  
                  properties:
                    Email:
                      type: string
                      example: "pru.....@g....com"
                      description: Correo electrónico del usuario
                    Token:
                      type: string
                      example: ""
                      description: Correo electrónico del usuario
                                           


/api/v1/register/verifyToken:
  post:
      tags: [Register User]
      summary: Verifica la vista por medio de un token
      security:
        - BearerAuth: []
      responses:       
        200:
          description: Respuesta exitosa
          content:
            application/json:
              schema:    
                type: object          
                properties:
                  error:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Vista autorizada"
                  
                        

/api/v1/register/verifyCode:
  post:
      tags: [Register User]
      summary: Se verifica el codigo de verificación del correo electrónico
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Code:
                  type: string
                  format: Code
                  description: Codigo de verificación del correo electrónico
                  example: ""
      responses:       
        200:
          description: Respuesta exitosa
          content:
            application/json:
              schema:    
                type: object          
                properties:
                  error:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Operación exitosa"
                  body:
                    type: object  
                    properties:
                      Hash:
                        type: string
                        example: ""
                        description: Hash de inicio de sesión para el primer inicio de sesión (opcional)
                      
/api/v1/register/sendCodeAgain:
  get:
      tags: [Register User]
      summary: Reenviando un nuevo código de verificación al correo electrónico
      security:
        - BearerAuth: []     
      responses:       
        200:
          description: Respuesta exitosa
          content:
            application/json:
              schema:    
                type: object          
                properties:
                  error:
                    type: boolean
                    example: false
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Se ha enviado el nuevo código de verificación"
                  




