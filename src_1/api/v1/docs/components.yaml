components:
  schemas:
    DefaultResponse:
      type: object
      properties:
        error:
          type: boolean
          example: false
        status:
          type: integer
          example: 200
        message:
          type: string
          example: "Operación exitosa"
        body:
          type: object
          nullable: true

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT # Aquí se especifica que el token es un JWT, pero puede ser otro tipo de token.